<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Black Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar: Email List -->
    <nav class="sidebar">
      <div class="header">
        <h1 class="site-title">Little Black Book</h1>
        <p class="site-tagline">The Unsealed Archives</p>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search the archives...">
      </div>
      <ul id="emailList" class="email-list"></ul>
    </nav>

    <!-- Main Content: Email Viewer -->
    <main class="main">
      <div id="emailViewer" class="viewer">
        <div class="welcome-message">
          <div class="welcome-icon">&#9670;</div>
          <p>Select a document to view.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
